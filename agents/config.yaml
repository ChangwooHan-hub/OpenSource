paths:
  architecture_xmi: design/Architecture.xmi
  unit_design_xmi: design/UnitDesign.xmi
  reports_dir: design/reports

openai:
  enabled: true
  sdr_model: gpt-5.2
  sar_model: gpt-5.2
  max_output_tokens: 4096

parser:
  compile_args:
    - -x
    - c++
    - -std=c++17
  source_extensions:
    - .c
    - .cc
    - .cpp
    - .cxx
    - .h
    - .hh
    - .hpp
    - .hxx

architecture:
  allowed_external_dependencies:
    - std
    - stdint
    - stddef
    - stdbool
